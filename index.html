<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Action Advisor</title>
  <meta name="description" content="Suivi de portefeuille, actualités et conseils d'achat / vente, avec IA à la demande.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Advisor">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Action Advisor</h1>
      <div class="top-actions">
        <button id="refresh" class="icon" aria-label="Actualiser">↻</button>
        <button id="add-btn" class="icon primary" aria-label="Ajouter">+</button>
      </div>
    </div>
    <div id="summary" class="summary"></div>
  </header>

  <main id="app"></main>

  <nav>
    <button data-tab="portfolio"><span>◧</span>Portefeuille</button>
    <button data-tab="signals"><span>⚑</span>Signaux</button>
    <button data-tab="news"><span>☰</span>Actus</button>
    <button data-tab="settings"><span>⚙</span>Réglages</button>
  </nav>

  <dialog id="detail"></dialog>
  <dialog id="add"></dialog>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
